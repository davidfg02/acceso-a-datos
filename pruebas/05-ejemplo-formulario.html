<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario responsive</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
        }

        input,
        select,
        option {
            font-family: "Segoe UI", sans-serif;
            font-size: 1rem;
            padding: 3px 8px;
        }

        form {
            background: #f5f5f5;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border: #eee solid 1px;
        }

        input,
        select {
            width: 100%;
            margin-bottom: 15px;
        }

        input[type="submit"] {
            border: none;
            background: forestgreen;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 6px 15px;
            /* Alto, ancho */
            width: 300px;
        }

        input[type="checkbox"] {
            width: auto;
            margin-bottom: 0;
        }

        input[type="radio"] {
            width: auto;
            margin-bottom: 0;
        }

        input[type="submit"]:hover {
            background-color: #29a629;
            box-shadow: 3px 4px grey;
        }

        #boton {
            text-align: left;
        }

        .fila {
            display: flex;
            gap: 20px;
            align-items: end;
        }

        .columna1 {
            width: 30%;
        }

        .columna2 {
            width: 70%;
        }

        .columna21 {
            width: 90%;
        }

        .columna22 {
            width: 10%;
        }

        .columna31 {
            width: 25%;
        }

        .columna32 {
            width: 50%;
        }

        .columna33 {
            width: 25%;
        }

        .columna41 {
            width: 70%;
        }

        .columna42 {
            width: 30%;
        }

        .columna51 {
            width: 50%;
        }

        .columna52 {
            width: 50%;
        }

        form {
            padding: 20px;
            max-width: 600px;
        }

        .fila {
            max-width: 600px;
        }
    </style>
</head>

<body>
    <header>Formulario responsive</header>
    <article>
        <form action="http://www.cursos-diseño.es/mostrar.php" method="post">
            <div class="fila">
                <div class="columna1">
                    Nombre
                    <input type="text" name="nombre">
                </div>
                <div class="columna2">
                    Apellidos
                    <input type="text" name="apellidos">
                </div>
            </div>
            <div class="fila">

                <div class="columna21">
                    Calle
                    <input type="text" name="calle">
                </div>

                <div class="columna22">
                    Nº
                    <input type="number" name="numero" min="1">
                </div>

            </div>


            <div class="fila">

                <div class="columna31">
                    CP
                    <input type="text" name="cp" maxlength="5">
                </div>

                <div class="columna32">
                    Población
                    <input type="text" name="poblacion">
                </div>

                <div class="columna33">
                    Provincia
                    <select name="provincia" id="provincia" required>
                        <option value="">Selecciona</option>
                        <option value="01">Álava</option>
                        <option value="02">Albacete</option>
                        <option value="03">Alicante</option>
                        <option value="04">Almería</option>
                        <option value="33">Asturias</option>
                        <option value="05">Ávila</option>
                        <option value="06">Badajoz</option>
                        <option value="08">Barcelona</option>
                        <option value="09">Burgos</option>
                        <option value="10">Cáceres</option>
                        <option value="11">Cádiz</option>
                        <option value="39">Cantabria</option>
                        <option value="12">Castellón</option>
                        <option value="13">Ciudad Real</option>
                        <option value="14">Córdoba</option>
                        <option value="16">Cuenca</option>
                        <option value="17">Girona</option>
                        <option value="18">Granada</option>
                        <option value="19">Guadalajara</option>
                        <option value="20">Guipúzcoa</option>
                        <option value="21">Huelva</option>
                        <option value="22">Huesca</option>
                        <option value="07">Islas Baleares</option>
                        <option value="23">Jaén</option>
                        <option value="15">La Coruña</option>
                        <option value="26">La Rioja</option>
                        <option value="35">Las Palmas</option>
                        <option value="24">León</option>
                        <option value="25">Lleida</option>
                        <option value="27">Lugo</option>
                        <option value="28">Madrid</option>
                        <option value="29">Málaga</option>
                        <option value="30">Murcia</option>
                        <option value="31">Navarra</option>
                        <option value="32">Ourense</option>
                        <option value="34">Palencia</option>
                        <option value="36">Pontevedra</option>
                        <option value="37">Salamanca</option>
                        <option value="40">Segovia</option>
                        <option value="41">Sevilla</option>
                        <option value="42">Soria</option>
                        <option value="43">Tarragona</option>
                        <option value="44">Teruel</option>
                        <option value="45">Toledo</option>
                        <option value="46">Valencia</option>
                        <option value="47">Valladolid</option>
                        <option value="48">Vizcaya</option>
                        <option value="49">Zamora</option>
                        <option value="50">Zaragoza</option>
                    </select>
                </div>

            </div>


            <div class="fila">

                <div class="columna41">
                    Email
                    <input type="email" name="email" placeholder="email@direccion.com">
                </div>

                <div class="columna42">
                    Teléfono
                    <input type="tel" name="telefono" placeholder="666 12 34 56" maxlength="9">
                </div>

            </div>
            <div class="fila">

                <div class="columna51">

                    Inglés
                    <br>

                    <label>
                        <input type="radio" name="ingles" value="basico"> Básico
                    </label> <br>
                    <label>
                        <input type="radio" name="ingles" value="medio" checked> Medio <br>
                    </label>
                    <label>
                        <input type="radio" name="ingles" value="avanzado"> Avanzado
                    </label>

                </div>


                <div class="columna52">

                    Disponibilidad
                    <br>

                    <label>
                        <input type="radio" name="disponibilidad" value="maniana"> Mañana
                    </label> <br>
                    <label>
                        <input type="radio" name="disponibilidad" value="tarde"> Tarde <br>
                    </label>
                    <label>
                        <input type="radio" name="disponibilidad" value="indiferente" checked>
                        Ambos
                    </label>

                </div>

            </div>
            <br>
            <label>
                <input type="checkbox" name="terminos" value="si" required>
                Acepto los <a href="terminosycondiciones.html" target="_blank">términos y condiciones</a>
            </label>


            <div id="boton">
                <input type="submit" value="Enviar">
            </div>

        </form>

    </article>

</body>

</html>
