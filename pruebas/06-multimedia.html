<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 400;
            aspect-ratio: 4/3;
            object-fit: cover;
            /*Recortar imagen sin cambiar proporción*/
        }

        #avatar {
            width: 200px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 4px 8px grey;
        }

        #primero {
            text-align: right;
        }

        #segundo {
            text-align: center;
        }

        #tercero {
            background: url("madrid3.jpg") center, no-repeat;
            /*Poner una imagen de fondo*/
            background-size: cover;
            width: 300px;
            height: 300px;
        }

        h3 {
            font-size: 5rem;
            text-align: center;
            color: white;
            text-shadow: 0 3px 6px black;
        }

        video {
            width: 60%;
            aspect-ratio: 16/9;
            background: orange;
        }

        .derecha {
            text-align: right;
        }

        .centro {
            text-align: center;
        }
        iframe {
            width: 100%;
            aspect-ratio: 16/10;
        }
    </style>
</head>

<body>
    <h2>Imagen</h2>
    <p id="primero">
        <img src="madrid4.jpg" alt="barra" id="foto">

    </p>
    <div id="segundo">
        <img src="perrito.webp" id="avatar">
    </div>

    <section id="tercero">
        <h3>Plaza dos de mayo</h3>
    </section>

    <h2>Video</h2>
    <div class="derecha">
        <video src="pelicula.mp4" controls></video>

    </div>

    <h2>audio</h2>
    <div class="centro">
        <audio src="sonido.mp3" controls></audio>
    </div>

    <h2>pdf</h2>
    <iframe src="ficha.pdf"></iframe>
    <h2>link</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2886.3229278902504!2d-3.6296925241714204!3d40.44052227143578!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422ed8ee5b256d%3A0xf355c34f2b6fe355!2sUDIT%20Formaci%C3%B3n%20Profesional%20Superior!5e1!3m2!1ses!2ses!4v1791390165356!5m2!1ses!2ses"
        style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <div style="max-width:1024px">
        <div style="position:relative;height:0;padding-bottom:56.25%"><iframe
                src="https://embed.ted.com/talks/paul_kemp_robertson_bitcoin_sweat_tide_meet_the_future_of_branded_currency"
                title="Bitcoin. Sweat. Tide. Meet the future of branded currency."
                style="position:absolute;left:0;top:0;width:100%;height:100%" </iframe>
        </div>
    </div>



</body>

</html>
