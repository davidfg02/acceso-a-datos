<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', sans-serif;
        }

        .pequenio {
            width: 60px;
        }

        .mediano {
            width: 200px;
        }

        .grande {
            width: 100%;
        }

        table {
            width: 100%;
            max-width: 400px;
            margin: auto;
            /*centrada horizontalmente*/
            border-spacing: 8px;
        }

        td:nth-child(1) {
            text-align: right;
            vertical-align: top;
        }

        textarea {
            resize: none;
        }
        input, textarea, select, option {
            font-family: "Segoe UI", sans-serif;
            font-size: 1rem;
            padding: 3px 8px;
        }

        input, textarea {
            border: 1px solid grey;
            border-radius: 40px;
        }
        input[type='file'] {
            border:none;
        }

        input[type='submit'] {
            border: none;
            background: forestgreen;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 6px 15px; /*Alto, ancho*/
        }
        input[type='submit']:hover {
            background-color: #29a629;
            box-shadow: 3px 4px grey;
        }
        :required {
            border-bottom: 2px solid red;
        }
        :focus {
            background: lavender;
        }
    </style>
</head>

<body>
    <header>
        <h1>Formulario HTML</h1>
        <article>
            <h2>Formulario de búsqueda</h2>
            <form action="http://google.es/search" method="get">
                <!--action = donde vamos a enviar la informacion del form-->
                <input type="text" name="q">
                <input type="hidden" name="udm" value="2"><!--Sirve para enviar constantes-->
                <input type="submit" value="buscar">
                <input type="image" src="lupa.png">
            </form>
            <hr>
            <h2>Inputs y propiedades</h2>
            <form action="http://www.cursos-diseño.es/mostrar.php" method="post" autocomplete="off">
                <table>
                    <tr>
                        <td>Apellidos*</td>
                        <td><input type="text" name="apellidos" class="grande" autofocus required></td>
                        <!--autofocus solo se le deberia poner a uno(primero) paar que el cursor se ponga automatico-->
                    </tr>
                    <tr>
                        <td>Código postal</td>
                        <td><input type="text" name="cp" maxlength="5" minlength="5"
                                class="pequenio"><!--Como maximo admita 5 y como minimo admita 5--></td>
                    </tr>
                    <tr>
                        <td>Teléfono</td>
                        <td><input type="text" name="telefono" placeholder="+34 123 45 67 89" class="mediano"></td>
                        <!--Placeholder = sugerencia-->
                    </tr>
                    <!--Cuando el dato a introducir son cifras pero no indica una cantidad, será de tipo texto-->
                    <tr>
                        <td>Ciudad</td>
                        <td><input type="text" name="ciudad" value="Madrid"></td>
                        <!--valor predeterminado si el usuario no lo cambia-->
                    </tr>
                    <tr>
                        <td>Contraseña</td>
                        <td><input type="password" name="clave" class="pequenio">
                            <input type="button" value="ver" onmousedown="document.getElementById('clave').type='text' "
                                onmouseup="document.getElementById('clave').type='password'">
                        </td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td><input type="email" name="email" placeholder="direccion@email.com" class="mediano"
                                autocomplete="off"></td> <!--Desactivar autocompletado-->
                    </tr>
                    <tr>
                        <td>Comentarios</td>
                        <td><textarea name="comentario" class="grande" rows="5"> </textarea> </td>
                        <!--eliminar cambio de tamaño se hace desde css con resize: none-->
                    </tr>
                    <tr>
                        <td>Edad</td>
                        <td><input type="number" name="edad" value="25" min="18" max="65" class="pequenio"> </td>
                    </tr>
                    <tr>
                        <td>Latas</td>
                        <td><input type="number" name="latas" min="6" value="12" step="6" class="pequenio"></td>
                    </tr>
                    <tr>
                        <td>Ingredientes</td>
                        <td>
                            <label>
                                <input type="checkbox" name="tomate" value="si">
                                Tomate
                            </label> <br><!--label para que tambien se pueda pulsar en el texto y marcar-->
                            <label>
                                <input type="checkbox" name="alcaparras" value="si">
                                Alcaparras
                            </label><br>
                            <label>
                                <input type="checkbox" name="anchoas" value="si">
                                Anchoas
                            </label> <br>
                            <label>
                                <input type="checkbox" name="queso" value="si">
                                Extra queso
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td>Horario</td>
                        <td>
                            <label>
                                <input type="radio" name="horario" value="maniana"> Mañana
                            </label> <br>
                            <label>
                                <input type="radio" name="horario" value="tarde"> Tarde <br>
                            </label>
                            <label>
                                <input type="radio" name="horario" value="indiferente" checked>
                                Indiferente<!--Opcion predeterminada-->
                            </label>

                        </td>
                    </tr>
                    <tr>
                        <td>Habitación</td>
                        <td>
                            <select name="habitacion">
                                <option value="i1">Individual</option>
                                <option value="d2">Doble 2 camas</option>
                                <option value="d1">Doble matrimonio</option>
                                <option value="t3">Triple 3 camas</option>
                                <option value="t2">Triple con matrimonio + individual</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Provincias</td>
                        <td><select name="provincia" id="provincia" required>
                                <option value="">Selecciona una provincia</option>

                                <option value="04">Almería</option>
                                <option value="01">Álava</option>
                                <option value="02">Albacete</option>
                                <option value="03">Alicante</option>
                                <option value="33">Asturias</option>
                                <option value="05">Ávila</option>
                                <option value="06">Badajoz</option>
                                <option value="08">Barcelona</option>
                                <option value="09">Burgos</option>
                                <option value="10">Cáceres</option>
                                <option value="11">Cádiz</option>
                                <option value="39">Cantabria</option>
                                <option value="12">Castellón</option>
                                <option value="13">Ciudad Real</option>
                                <option value="14">Córdoba</option>
                                <option value="16">Cuenca</option>
                                <option value="20">Guipúzcoa</option>
                                <option value="17">Girona</option>
                                <option value="18">Granada</option>
                                <option value="19">Guadalajara</option>
                                <option value="21">Huelva</option>
                                <option value="22">Huesca</option>
                                <option value="07">Islas Baleares</option>
                                <option value="23">Jaén</option>
                                <option value="15">La Coruña</option>
                                <option value="26">La Rioja</option>
                                <option value="35">Las Palmas</option>
                                <option value="24">León</option>
                                <option value="25">Lleida</option>
                                <option value="27">Lugo</option>
                                <option value="28">Madrid</option>
                                <option value="29">Málaga</option>
                                <option value="30">Murcia</option>
                                <option value="31">Navarra</option>
                                <option value="32">Ourense</option>
                                <option value="34">Palencia</option>
                                <option value="36">Pontevedra</option>
                                <option value="26">La Rioja</option>
                                <option value="37">Salamanca</option>
                                <option value="40">Segovia</option>
                                <option value="41">Sevilla</option>
                                <option value="42">Soria</option>
                                <option value="43">Tarragona</option>
                                <option value="44">Teruel</option>
                                <option value="45">Toledo</option>
                                <option value="46">Valencia</option>
                                <option value="47">Valladolid</option>
                                <option value="48">Vizcaya</option>
                                <option value="49">Zamora</option>
                                <option value="50">Zaragoza</option>
                            </select></td>
                    </tr>
                    <tr>
                        <td>Foto</td>
                        <td>
                            <input type="file" name="foto" accept="image/">
                        </td>
                    </tr>
                    <tr>
                        <td>Fecha</td>
                        <td>
                            <input type="date" name="fecha" value="2026-12-30" min="2026-11-11" max="2027-01-20"
                                step="7"> <!-- value =salto entre un valor y el siguiente-->
                        </td>
                    </tr>
                    <tr>
                        <td>Hora</td>
                        <td>
                            <input type="time" name="hora" min="12:15" max="17:45" value="15:30" step="900">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <lable>
                                <input type="checkbox" name="acepto" value="si" required> Acepto los términos y
                                condiciones
                            </lable>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="hidden" name="origen" value="Página del formulario">
                            <input type="submit" value="comprobar">
                        </td>
                    </tr>

                </table>



            </form>



        </article>
    </header>

</body>

</html>
