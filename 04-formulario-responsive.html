<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario responsive</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
        }
        input, textarea, select, option {
            font-family: "Segoe UI", sans-serif;
            font-size: 1rem;
            padding: 3px 8px;
        }
        form {
            background: #f5f5f5;
            width:100%;
            max-width: 400px;
            padding:30px;
            border:#eee solid 1px;
        }
        input, textarea {
            width: 100%;
        }
    </style>
</head>

<body>
    <header> Formulario responsive</header>
    <article>
        <form action="http://www.cursos-diseño.es/mostrar.php" method="post">
            Nombre
            <input type="text" name="nombre">
            Email
            <input type="email" name="email">
            Teléfono
            <input type="text" name="telefono">
            Tipo de habitación
            <select name="habitacion">
                <option value="i1">Individual</option>
                <option value="d2">Doble 2 camas</option>
                <option value="d1">Doble matrimonio</option>
                <option value="t3">Triple 3 camas</option>
                <option value="t2">Triple con matrimonio + individual</option>
            </select>
            Comentario
            <textarea name="comentario" class="grande" rows="5"> </textarea>
            <input type="submit">

        </form>

    </article>

</body>

</html>
